services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: youtube
      POSTGRES_PASSWORD: youtube
      POSTGRES_DB: youtube
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtube -d youtube"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-01-03T00-00-00Z
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./services/api
    environment:
      NODE_ENV: development
      PORT: 4000
      PUBLIC_BASE_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:4000

      DATABASE_URL: postgresql://youtube:youtube@postgres:5432/youtube

      REDIS_URL: redis://redis:6379

      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio12345
      S3_BUCKET: youtube
      S3_PUBLIC_BASE_URL: http://localhost:9000/youtube

      JWT_ACCESS_SECRET: replace-me-access-secret-at-least-32-chars
      JWT_REFRESH_SECRET: replace-me-refresh-secret-at-least-32-chars
      COOKIE_SECRET: replace-me-cookie-secret-at-least-32-chars

      UPLOAD_MAX_BYTES: 1073741824
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./services/worker
    environment:
      NODE_ENV: development

      DATABASE_URL: postgresql://youtube:youtube@postgres:5432/youtube
      REDIS_URL: redis://redis:6379

      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio12345
      S3_BUCKET: youtube

      FFMPEG_THREADS: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  minio_data:

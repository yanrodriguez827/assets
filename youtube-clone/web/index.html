<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VideoClone</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <a class="logo" href="/"><b>Video</b>Clone</a>
    <form class="search" id="searchForm">
      <input id="q" placeholder="Search" />
      <button type="submit">Search</button>
    </form>
    <a class="btn" href="/upload.html">Upload</a>
    <a class="btn" href="/auth.html">Login</a>
  </header>
  <main>
    <div class="row" style="justify-content:space-between">
      <div class="tag">Home feed</div>
      <div class="small">Tip: upload a video to start</div>
    </div>
    <hr />
    <div id="grid" class="grid"></div>
  </main>

  <script type="module">
    import { wireHeader, renderHome } from '/app.js';
    wireHeader();
    renderHome().catch(e => console.error(e));
  </script>
</body>
</html>
